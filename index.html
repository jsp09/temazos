<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temazos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Temazos">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFE14D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFE14D;--ink:#000;--pink:#FF5FA2;--sky:#4CC3FF;--orange:#FF7A1A;--purple:#9B6BFF;--mint:#7CF5C4;--green:#4BE08A;--red:#FF5A4E;--amber:#FF9F1C;--mut:#3d3a33}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 60px}
.D{font-family:'Dela Gothic One',Impact,'Arial Black',sans-serif;font-weight:400}
button,input,select{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.logo{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 4px}
h1{font-family:'Dela Gothic One',Impact,sans-serif;font-weight:400;font-size:46px;letter-spacing:-1px;line-height:1}
.sub{text-align:center;font-size:15px;font-weight:600;margin-bottom:20px}
.panel{background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:16px;margin-bottom:16px}
.panel h2{font-family:'Dela Gothic One',Impact,sans-serif;font-weight:400;font-size:19px;margin-bottom:12px}
.panel h3{font-family:'Dela Gothic One',Impact,sans-serif;font-weight:400;font-size:16px;margin:18px 0 8px}
input[type=text],input[type=number],textarea{width:100%;background:#fff;border:3px solid var(--ink);border-radius:0;padding:10px 12px;font-size:16px;font-weight:600}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.btn{border:3px solid var(--ink);border-radius:0;padding:11px 16px;font-weight:800;font-size:16px;cursor:pointer;background:#fff;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .06s}
.btn:active{transform:translate(2px,2px)}
.btn.big{width:100%;padding:15px;font-family:'Dela Gothic One',Impact,sans-serif;font-weight:400;font-size:20px;background:var(--ink);color:var(--bg);box-shadow:4px 4px 0 var(--pink)}
.btn.pink{background:var(--pink);color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.btn.cyan{background:var(--sky);color:var(--ink)}
.btn.orange{background:var(--orange);color:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:14px;min-height:44px}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.x{background:#fff;border:3px solid var(--ink);width:44px;height:44px;font-size:20px;flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sq{width:44px;height:44px;flex:none;background:#fff;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.sq:disabled{opacity:.4}
.seg{display:flex;border:3px solid var(--ink);background:#fff}
.seg button{flex:1;border:none;border-left:3px solid var(--ink);background:#fff;padding:10px 6px;font-weight:800;font-size:14px;cursor:pointer;min-height:44px}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--ink);color:var(--bg)}
.stepper{display:flex;align-items:center;border:3px solid var(--ink);background:#fff}
.stepper button{width:44px;height:44px;border:none;background:#fff;font-size:22px;font-weight:800;cursor:pointer}
.stepper b{font-family:'Dela Gothic One',Impact,sans-serif;font-weight:400;font-size:22px;min-width:44px;text-align:center;border-left:3px solid var(--ink);border-right:3px solid var(--ink);line-height:44px}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.set .l{font-weight:800}.set .l small{display:block;color:var(--mut);font-weight:400;font-size:13px;margin-top:2px}
.note{font-size:14px;color:var(--mut);line-height:1.45}
.note a,.steps a{color:var(--ink);font-weight:800}
.deck{display:flex;align-items:center;gap:12px;padding:10px 12px;border:3px solid var(--ink);margin-bottom:8px;cursor:pointer;background:#fff}
.deck.on{background:var(--pink)}
.deck .ck{width:24px;height:24px;border:3px solid var(--ink);flex:none;display:flex;align-items:center;justify-content:center;background:#fff}
.deck .nm{flex:1;min-width:0}.deck .nm b{display:block;font-size:15px}.deck .nm span{font-size:13px;color:var(--mut)}
.deck.on .nm span{color:var(--ink)}
.deck .ct{font-family:'Dela Gothic One',Impact,sans-serif;font-size:14px}
.deck.dis{opacity:.5}
.mini{display:flex;gap:6px;margin:-2px 0 10px 0;flex-wrap:wrap}
.mini a,.mini label{font-size:13px;font-weight:800;color:var(--ink);border:2px solid var(--ink);background:#fff;padding:5px 9px;text-decoration:none;cursor:pointer}
.mini input{display:none}
.dot{width:12px;height:12px;flex:none;border:2px solid var(--ink)}
.psel{background:#fff;border:3px solid var(--ink);border-radius:0;padding:10px 6px;font-size:14px;font-weight:800;flex:none;max-width:110px}
.decs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dec{border:3px solid var(--ink);background:#fff;padding:6px 2px;min-height:56px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0}
.dec b{font-family:'Dela Gothic One',Impact,sans-serif;font-weight:400;font-size:17px;line-height:1}
.dec small{font-size:13px;font-weight:600;line-height:1}
.dec.on{background:var(--pink)}.dec:disabled{opacity:.35}
.steps{margin:0 0 10px 20px}.steps li{margin-bottom:12px;font-size:14px;line-height:1.45}
.rules li{margin:0 0 9px 18px;font-size:15px;line-height:1.45}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:9}
.modal .panel{max-width:440px;width:100%;max-height:90vh;overflow:auto;box-shadow:4px 4px 0 var(--pink);margin:0}
/* disc */
.disc{border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center;flex:none}
.disc>i{width:80%;height:80%;border-radius:50%;border:1px solid #3a3a3a;display:flex;align-items:center;justify-content:center}
.disc>i>i{width:75%;height:75%;border-radius:50%;border:1px solid #3a3a3a;display:flex;align-items:center;justify-content:center}
.disc>i>i>b.qm{font-family:'Outfit',system-ui,sans-serif;font-weight:800;font-style:normal;padding-bottom:0.04em}
.disc>i>i>b{width:65%;height:65%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Outfit',system-ui,sans-serif;font-weight:800;font-style:normal;line-height:1;color:#000;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-0.02em}
/* game */
.hdr{display:flex;gap:10px;align-items:stretch;margin-bottom:10px}
.whob{flex:1;min-width:0;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:7px 12px;display:flex;flex-direction:column;justify-content:center}
.whob span{font-size:13px;font-weight:600}
.whob b{font-family:'Dela Gothic One',Impact,sans-serif;font-weight:400;font-size:30px;line-height:1.08;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;align-items:center}
.scores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.sc{border:3px solid var(--ink);background:#fff;padding:6px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.sc.cur{box-shadow:4px 4px 0 var(--ink)}
.sc .l1{display:flex;align-items:center;gap:6px}
.sc .nm{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .pt{margin-left:auto;font-family:'Dela Gothic One',Impact,sans-serif;font-size:20px;line-height:1;white-space:nowrap}
.sc .pt small{font-family:'Outfit',sans-serif;font-size:13px;font-weight:600}
.sc .tk{display:flex;align-items:center;gap:3px;height:16px;font-size:12px;font-weight:600}
.box{background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);margin-bottom:12px}
.mystery{display:flex}
.discpan{width:116px;flex:none;border-right:3px solid var(--ink);display:flex;align-items:center;justify-content:center;padding:10px 0}
.mbody{flex:1;min-width:0;padding:12px;display:flex;flex-direction:column;gap:10px}
.lvl{align-self:flex-start;border:2px solid var(--ink);padding:2px 8px;font-size:13px;font-weight:800;background:#fff}
.lvl-normal{background:var(--mint)}.lvl-medium{background:var(--sky)}.lvl-pro{background:var(--orange)}.lvl-expert{background:var(--red)}
.minst{font-size:15px;line-height:1.3}
.mbtns{display:flex;gap:8px}
.mbtns .btn{flex:1;min-height:46px;padding:8px 10px}
.mbtns .sq{width:46px;height:46px}
.hint{font-size:12px;color:var(--mut);line-height:1.35}
.timer{font-family:'Dela Gothic One',Impact,sans-serif;font-size:26px;line-height:1}.timer.hot{color:var(--red)}
.acts{display:flex;gap:8px;margin:10px 0 12px}.acts .btn{flex:1}
.pad{padding:12px;display:flex;flex-direction:column;gap:10px}
.qrow{display:flex;gap:12px;align-items:center}
.qrow .D{font-size:18px;line-height:1.15}
.bet{display:flex;align-items:center;gap:8px;background:var(--sky);border:3px solid var(--ink);padding:8px 10px;font-weight:800}
.bet small{margin-left:auto;font-weight:600;font-size:13px;white-space:nowrap}
.dash{border-style:dashed!important}
.reveal{display:flex;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);margin-bottom:12px}
.reveal.ok{background:var(--green)}.reveal.pend{background:var(--amber)}.reveal.ko{background:var(--red)}
.reveal .discpan{background:#000}
.reveal .rb{flex:1;min-width:0;padding:12px;display:flex;flex-direction:column;gap:3px}
.reveal .res{font-size:14px;font-weight:800;line-height:1.3}
.reveal .yr{font-family:'Dela Gothic One',Impact,sans-serif;font-size:42px;line-height:1}
.reveal .t{font-weight:800;font-size:16px}.reveal .a{font-size:14px}
.reveal .note{color:var(--ink);font-size:13px;margin-top:4px}
.link{background:none;border:none;font-size:13px;font-weight:600;text-decoration:underline;cursor:pointer;align-self:flex-start;margin-top:4px;padding:6px 0}
.togs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.tog{min-height:44px;background:#fff;border:3px solid var(--ink);font-size:14px;font-weight:800;display:inline-flex;align-items:center;gap:8px;padding:0 12px;cursor:pointer}
.tog i{width:16px;height:16px;border:2px solid var(--ink);display:inline-block;flex:none}
.tog.on{background:var(--ink);color:var(--bg)}
.tog.on i{border:none;width:auto;height:auto}
.tlh{font-family:'Dela Gothic One',Impact,sans-serif;font-weight:400;font-size:17px;margin:6px 0 8px}
.tl{display:flex;flex-direction:column;border:3px solid var(--ink);background:#fff}
.tl>*{border-bottom:3px solid var(--ink)}.tl>*:last-child{border-bottom:none}
.band{display:flex;gap:12px;align-items:center;padding:9px 12px}
.band .by{font-family:'Dela Gothic One',Impact,sans-serif;font-size:28px;line-height:1;flex:none}
.band .bt{display:flex;flex-direction:column;min-width:0}
.band .bt b{font-weight:800;font-size:15px;line-height:1.25}
.band .bt span{font-size:13px}
.band .tags{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.own{border:2px solid var(--ink);background:#fff;padding:1px 7px;font-size:12px;font-weight:800;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:5px}
.own i{width:10px;height:10px;border:2px solid var(--ink);flex:none;display:inline-block}
.legend{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;margin:-2px 0 8px}
.legend .lg{display:flex;flex-wrap:wrap;gap:5px 12px}
.lvm{display:inline-flex;gap:2px;align-items:center}
.lvm i{width:9px;height:9px;border:2px solid var(--ink);background:#fff;display:inline-block}
.lvm i.f{background:var(--ink)}
.legend .lvm{margin-right:5px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i.dq{width:14px;height:14px;border:2px solid var(--ink);display:inline-block}
.nuevo{background:#000;color:var(--bg);padding:2px 8px;font-size:12px;font-weight:800}
.gap{min-height:34px;border:none;background:#fff;font-size:14px;font-weight:600;text-align:left;padding:6px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;width:100%}
.gap.sel{min-height:46px;background:#000;color:var(--bg);font-weight:800;font-size:15px}
.gap.st{min-height:46px;background:var(--sky);font-weight:800;font-size:15px}
.gap:disabled{cursor:default;color:#5c5c5c;font-size:13px;min-height:30px}
.gap.sel:disabled,.gap.st:disabled{color:inherit;font-size:15px;min-height:46px}
.gap.sel:disabled{color:var(--bg)}
.rotate{display:none}
.win{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--pink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:20px 16px;margin-bottom:16px;text-align:center}
.win .D{font-size:44px;line-height:1}
table.stats{width:100%;border-collapse:collapse;font-size:14px}
table.stats th{font-weight:600;font-size:12px;text-align:left;padding:6px 6px}
table.stats td{padding:9px 6px;border-top:3px solid var(--ink)}
table.stats td.D{font-size:18px}
/* TV */
body.tv .wrap{max-width:none;padding:16px 22px 24px}
body.tv .board{display:grid;grid-template-columns:minmax(260px,32%) 1fr;gap:24px;align-items:start}
body.tv .tl{flex-direction:row;flex-wrap:wrap;gap:10px;border:none;background:transparent;align-items:stretch}
body.tv .tl>*{border-bottom:none}
body.tv .band{flex-direction:column;align-items:flex-start;width:150px;border:3px solid var(--ink);padding:10px;gap:6px}
body.tv .band .by{font-size:32px}
body.tv .band .bt b{font-size:15px}
body.tv .band .tags{margin:auto 0 0 0;align-items:flex-start;flex-direction:column-reverse}
body.tv .band.new{outline:5px solid var(--ink);outline-offset:3px}
body.tv .gap{width:46px;min-height:120px;padding:4px;flex-direction:column;justify-content:center;text-align:center;font-size:11px;font-weight:800;border:3px dashed var(--ink);background:rgba(255,255,255,.6)}
body.tv .gap.sel,body.tv .gap.st{border-style:solid}
body.tv .gap.sel{background:#000}
body.tv .gap .gl{display:none}
body.tv .gap small{display:block;max-width:100%;overflow:hidden}
body.tv .whob b{font-size:40px}
body.tv .discpan{width:150px}
body.tv .reveal .yr{font-size:56px}
@media (max-height:500px){body.tv .wrap{padding:8px 14px 16px}body.tv .whob b{font-size:24px}body.tv .hdr{margin-bottom:6px}body.tv .scores{margin-bottom:8px}
body.tv .sc{padding:4px 8px}body.tv .discpan{width:96px}body.tv .box,body.tv .reveal{margin-bottom:8px}body.tv .btn.big{padding:10px;font-size:16px}
body.tv .band{width:104px;padding:6px;gap:3px}body.tv .band .by{font-size:20px}body.tv .band .bt b{font-size:12px}body.tv .band .bt span{font-size:11px}
body.tv .gap{width:34px;min-height:84px}body.tv .reveal .yr{font-size:34px}body.tv .minst{font-size:13px}body.tv .mbody{gap:6px;padding:8px}}
@media (orientation:portrait){body.tv .rotate{display:block;text-align:center;font-size:14px;font-weight:800;background:#fff;border:3px solid var(--ink);padding:8px;margin-bottom:10px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="modal hidden" id="modal"><div class="panel" id="modalBody"></div></div>

const deckCards=k=>(DATA[k]||S.customs[k]||[]);
const decOf=y=>Math.max(1950,Math.min(2020,Math.floor(y/10)*10));
const DECS=[1950,1960,1970,1980,1990,2000,2010,2020];
function pool(){
  const fx=S.yearFix||{},dec=S.decades||[],byKey=new Map(),list=[];
  const n=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
  const nk=(a,t)=>n(String(t).split(/ - |\(|\[/)[0])+'|'+n(String(a).split(/,|&| feat| ft\.| y | x /i)[0]);
  // La misma canción en varias barajas (aunque sea otra versión o remaster) sale una sola vez, con el año más antiguo
  S.sel.forEach(k=>deckCards(k).forEach(([a,t,y,id])=>{const key=id||(a+'|'+t).toLowerCase(),k2=nk(a,t);
    if(fx[key])y=fx[key];
    const prev=byKey.get(key)||byKey.get(k2);
    if(prev){if(y<prev.y&&!fx[prev.id||(prev.a+'|'+prev.t).toLowerCase()])prev.y=y;byKey.set(key,prev);byKey.set(k2,prev);return}
    const c={a,t,y,id};byKey.set(key,c);byKey.set(k2,c);list.push(c)}));
  return dec.length?list.filter(c=>dec.includes(decOf(c.y))):list;
}

function parseCSV(txt){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c=='"'){if(txt[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;else if(c==','){row.push(f);f=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&txt[i+1]=='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.length>1);
}
function importCSV(k,file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{const rows=parseCSV(r.result);const h=rows.shift().map(x=>x.toLowerCase());
    const ix=ks=>h.findIndex(x=>ks.some(kk=>x.includes(kk)));
    const iU=ix(['uri']),iT=ix(['track name','name']),iA=ix(['artist']),iD=ix(['release date']);
    if(iT<0||iA<0||iD<0){$('#imsg').textContent='No reconozco el formato del CSV.';return}
    const out=[];rows.forEach(c=>{const y=parseInt((c[iD]||'').slice(0,4));if(!y||!c[iT])return;
      out.push([(c[iA]||'').split(/[,;]/)[0].trim(),c[iT],y,iU>=0?(c[iU]||'').split(':').pop():''])});
    S.customs[k]=out;if(out.length&&!S.sel.includes(k))S.sel.push(k);save();render();
    $('#imsg').textContent=`${out.length} canciones importadas. Ojo: Spotify a veces da el año de una remasterización.`};
  r.readAsText(file);
}

    if(S.refund)(r.cands||[]).filter(p=>p!==w&&qualifies(G,p)).forEach(p=>G.players[p].tokens++);}

async function spLogin(){

async function spCallback(){

async function api(path,opt={},retry=true){

  SP.paused=true;
  if(!ok){const j=await r.json().catch(()=>({}));msg('No se pudo pausar: '+((j.error&&j.error.message)||r.status)+'. Si suena en el iPhone, abre Spotify un momento y vuelve.','sphint')}
  else msg(SP.pos!=null?'En pausa':(awake()?'En pausa. Ojo: en iPhone, si pasa mucho rato, Spotify se puede dormir':'En pausa'),'sphint');if(S.screen==='game'&&S.game&&S.game.phase==='guess')render()}catch(e){msg(e.message,'sphint')}}
async function spResume(){try{
  const dq=SP.dev?'?device_id='+SP.dev:'';
  const r=SP.pos!=null&&SP.posId?await api('/me/player/play'+dq,{method:'PUT',body:JSON.stringify({uris:['spotify:track:'+SP.posId],position_ms:SP.pos})}):await api('/me/player/play'+dq,{method:'PUT'});
  SP.paused=false;
  if(!(r.ok||r.status===204)){const j=await r.json().catch(()=>({}));msg('No se pudo continuar: '+((j.error&&j.error.message)||r.status),'sphint')}
  else{SP.pos=null;msg('Sonando…','sphint')}render()}catch(e){msg(e.message,'sphint')}}
function spToggle(){return SP.paused?spResume():spPause()}
async function spDevices(){
  try{const d=await (await api('/me/player/devices')).json();const L=d.devices||[];
    document.getElementById('devlist').innerHTML=L.length?L.map(x=>`<button class="btn ghost sm" style="margin:0 6px 6px 0" onclick="SP.dev='${x.id}';SP.devName='${esc(x.name).replace(/'/g,'')}';spSave();refreshSp()">${esc(x.name)}</button>`).join(''):'<p class="note">No veo dispositivos. Abre Spotify en el móvil o en el altavoz y dale al play una vez.</p>';
  }catch(e){msg(e.message)}
}
async function spImport(k,url){
  const id=url.split('/playlist/')[1].split('?')[0];msg('Importando…','imsg');
  try{let next='/playlists/'+id+'/items?limit=50',out=[];
    while(next){const r=await api(next);
      if(!r.ok){msg(r.status===403||r.status===404?'Spotify solo deja leer playlists que sean tuyas. Copia las canciones a una playlist propia o usa el CSV de Exportify.':'Error '+r.status,'imsg');return}
      const j=await r.json();(j.items||[]).forEach(it=>{const t=it.item||it.track;if(!t||!t.id||!t.album)return;
        const y=parseInt((t.album.release_date||'').slice(0,4));if(y)out.push([t.artists[0].name,t.name,y,t.id])});
      next=j.next?j.next.replace('https://api.spotify.com/v1',''):null}
    S.customs[k]=out;if(out.length&&!S.sel.includes(k))S.sel.push(k);save();render();
    msg(`${out.length} canciones importadas. Ojo: Spotify a veces da el año de una remasterización.`,'imsg');
  }catch(e){msg(e.message,'imsg')}
}

function render(){if(document.body)document.body.classList.toggle('tv',!!S.tv);({setup:renderSetup,game:renderGame,win:renderWin})[S.screen]()}
if(S.screen!=='setup'&&!S.game)S.screen='setup';
render();spCallback();
if(new URLSearchParams(location.search).has('wake')){history.replaceState(null,'',REDIR);if(S.screen==='game'&&S.game&&S.game.phase==='guess'&&SP.tok)setTimeout(spPlay,1200)}
</script>
